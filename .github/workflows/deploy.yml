name: Deploy to Vercel

# Деплой виконується після пуша в main. Потрібні secrets у налаштуваннях репозиторію:
# VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (Vercel Account Settings → Tokens;
# .vercel/project.json після `vercel link` містить orgId/projectId).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # поки секрети не додано — job пропускається, і робочий процес лишається зеленим
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.VERCEL_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy (білд виконує Vercel)
        run: npx vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
