name: Deploy to Vercel

# Деплой виконується після пуша в main. Потрібні secrets у налаштуваннях репозиторію:
# VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (Vercel Account Settings → Tokens;
# .vercel/project.json після `vercel link` містить orgId/projectId).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # значення секретів доступні на рівні job; умова без секретів перевіряється на кроці
    env:
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy (білд виконує Vercel)
        if: env.HAS_VERCEL_TOKEN == 'true'
        run: npx vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Пропущено — секрет VERCEL_TOKEN не налаштований
        if: env.HAS_VERCEL_TOKEN != 'true'
        run: echo "Додайте VERCEL_TOKEN, VERCEL_ORG_ID і VERCEL_PROJECT_ID у Secrets репозиторію (інструкція — README, розділ «Розгортання на Vercel»)."
