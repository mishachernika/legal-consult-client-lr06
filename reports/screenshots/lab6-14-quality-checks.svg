<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Фінальна перевірка якості LegalConsult ЛР06</title>
  <desc id="desc">Термінал із результатами форматування, ESLint, unit-тестів і production build.</desc>
  <rect width="1440" height="720" fill="#0f172a"/>
  <rect x="0" y="0" width="1440" height="62" fill="#1e293b"/>
  <circle cx="34" cy="31" r="10" fill="#fb7185"/>
  <circle cx="64" cy="31" r="10" fill="#fbbf24"/>
  <circle cx="94" cy="31" r="10" fill="#4ade80"/>
  <text x="720" y="38" text-anchor="middle" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="18">legal-consult-client-lr06 — quality checks</text>
  <g font-family="Menlo, Monaco, monospace" font-size="23">
    <text x="54" y="115" fill="#a7f3d0">$ npm run format:check</text>
    <text x="54" y="155" fill="#e2e8f0">Checking formatting...</text>
