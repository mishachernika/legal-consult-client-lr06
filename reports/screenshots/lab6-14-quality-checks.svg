    <text x="54" y="345" fill="#86efac">0 errors · 1 known React Hook Form warning</text>
    <text x="54" y="415" fill="#a7f3d0">$ npm test</text>
    <text x="54" y="455" fill="#e2e8f0">Test Files  4 passed (4)</text>
    <text x="54" y="495" fill="#86efac">Tests       11 passed (11)</text>
    <text x="54" y="565" fill="#a7f3d0">$ npm run build</text>
    <text x="54" y="605" fill="#e2e8f0">tsc -b &amp;&amp; vite build</text>
    <text x="54" y="645" fill="#86efac">✓ built successfully · PWA service worker generated</text>
